
name: Build History Game APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Check project files
        run: |
          pwd
          ls -la
          test -f pubspec.yaml || exit 1

      - name: Generate Android files
        run: flutter create --platforms=android .

     
      - name: Install Android NDK
        run: |
          SDK="$ANDROID_SDK_ROOT"
          echo "$SDK/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SDK/platform-tools" >> $GITHUB_PATH
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973"

      - name: Set NDK version
        run: |
          sed -i 's/ndkVersion = flutter.ndkVersion/ndkVersion = "27.0.12077973"/' android/app/build.gradle.kts
          cat android/app/build.gradle.kts

      - name: Get packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: History-Game-APK
          path: build/app/outputs/flutter-apk/app-release.apk
